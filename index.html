<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="css/style.css">
        <meta name="description" content="An interactive travel photo gallery built with HTML, CSS, and JavaScript. Explore expanding cards with your mouse or keyboard.">
        <title>Expanding Cards | Travel Photo Gallery</title>
    </head>
    <body>
        <header class="page-header">
            <h1>Expanding Cards</h1>
            <p>Explore five places, one card at a time.</p>
            <p class="gallery-help" id="gallery-help">Select a card to explore. Keyboard: Tab to move, Enter or Space to select.</p>
        </header>
        <main>
            <section aria-label="Travel photo gallery" aria-describedby="gallery-help">
                <button class="card active" type="button" aria-pressed="true" aria-label="Winter">
                    <img src="assets/img/city-on-winter.jpg" alt="">
                    <span class="card-title">winter</span>
                </button>
                <button class="card" type="button" aria-pressed="false" aria-label="world">
                    <img src="assets/img/explore-the-world.jpg" alt="">
                    <span class="card-title">world</span>
                </button>
                <button class="card" type="button" aria-pressed="false" aria-label="mountains">
                    <img src="assets/img/mountains.jpg" alt="">
                    <span class="card-title">mountains</span>
                </button>
                <button class="card" type="button" aria-pressed="false" aria-label="beach">
                    <img src="assets/img/sunny-beach.jpg" alt="">
                    <span class="card-title">beach</span>
                </button>
                <button class="card" type="button" aria-pressed="false" aria-label="forest">
                    <img src="assets/img/wild-forest.jpg" alt="">
                    <span class="card-title">forest</span>
                </button>
            </section>
        </main>
        <script src="js/script.js"></script>
    </body>
</html>

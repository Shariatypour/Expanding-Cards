<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Document</title>
</head>
<body>

   <section aria-label="Travel photo gallery">
    <button class="card active" type="button" aria-pressed="true" aria-label="Winter">
        <img src="assets/img/city-on-winter.jpg" alt=""> 
        <span class="card-title">winter</span>
    </button>
    <button class="card" type="button" aria-pressed="false" aria-label="world">
        <img src="assets/img/explore-the-world.jpg" alt="">
        <span class="card-title">world</span>
    </button>
    <button class="card" type="button" aria-pressed="false" aria-label="mountains">
        <img src="assets/img/mountains.jpg" alt="">
        <span class="card-title">mountains</span>
    </button>
    <button class="card" type="button" aria-pressed="false" aria-label="beach">
        <img src="assets/img/sunny-beach.jpg" alt="">
        <span class="card-title">beach</span>
    </button>
    <button class="card" type="button" aria-pressed="false" aria-label="forest">
        <img src="assets/img/wild-forest.jpg" alt="">
        <span class="card-title">forest</span>
    </button>
   </section>
    
    
    <script src="js/script.js"></script>
</body>
</html>
